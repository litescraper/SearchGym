cluster:
  fileroot: /path/to/experiments  # Your experiment output directory
  n_nodes: 1
  n_gpus_per_node: 8
  name_resolve:
    type: nfs
    nfs_record_root: /path/to/name_resolve  # Your name resolve directory
seed: 1
total_train_epochs: 10
total_train_steps: null
tokenizer_path: ${actor.path}
allocation_mode: sglang.d4p1t1+d4p1t1
async_training: true

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: 128
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  enable_rollout_tracing: true

gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 1024
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /path/to/your/model  # e.g., Qwen2.5-3B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 16000
  pad_to_maximum: true
  optimizer:
    type: adam
    lr: 5e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 0.2
    warmup_steps_proportion: 0.001
  backend: fsdp

  group_size: ${gconfig.n_samples}
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behav_imp_weight_cap: 5.0
  adv_norm:
    mean_level: batch
    std_level: batch

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer: null
  backend: fsdp

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.9
  attention_backend: fa3

# datasets
train_dataset:
  type: rl
  batch_size: 128
  shuffle: true
  pin_memory: true
  path: ../SearchGym-test-data/mini_wiki_train/stage1/stage1_train.jsonl

valid_dataset:
  type: rl
  batch_size: 512
  shuffle: false
  pin_memory: true
  path: ../SearchGym-test-data/mini_wiki_train/stage1/stage1_test.jsonl

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 30
  freq_secs: null

recover:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 30
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 30
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online

# Launcher
launcher:
  inference_server_cpus_per_gpu: 15
  inference_server_mem_per_gpu: 153600
  trainer_cpus_per_gpu: 15
  trainer_mem_per_gpu: 153600
  trainer_env_vars: PYTHONPATH=/path/to/SearchGym/SearchGym:/path/to/SearchGym/AReaL,WANDB_API_KEY=your-wandb-api-key


max_turns: 16
n_trajs: 8
search_client_type: meilisearch-local
reward_type: F1
topk: 3
valid_inst_ratio: 0.5
search_only: false
log_agent_stats: true
use_queue: true
redis_config:
  url: "redis://localhost:6379"
  request_timeout: 300
  poll_timeout: 30
log_agent_stats_keys:
  - num_input_tokens
  - num_output_tokens
  - num_llm_gens
  - num_search_queries
  - num_success_search_queries
  - num_failed_search_queries
  - num_pages
  - num_success_url_accesses
  - num_failed_url_accesses
  - score
  - judge_q_invalid
  - format_reward

# Access probability decay parameters
access_strict_start_ratio: 0
access_strict_end_ratio: 0
access_strict_decay_steps: 100